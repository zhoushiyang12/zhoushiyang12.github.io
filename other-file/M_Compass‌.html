<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>密位指南针</title>
  <style>
    :root {
      --bg-color: #0a0f0a;
      --primary-green: #2D4A2D;
      --accent-green: #4a7c4a;
      --text-green: #8fbc8f;
      --highlight-red: #cc3333;
      --tick-color: #e0e0e0;
      --text-color: #c0c0c0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; background: var(--bg-color); color: var(--text-color); touch-action: none; user-select: none; }
    .container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .coords-panel { width: 100%; padding: 15px; background: linear-gradient(180deg, #1a2a1a 0%, #0d150d 100%); border: 1px solid var(--primary-green); border-radius: 8px; margin-bottom: 20px; }
    .mercator-title { font-size: 12px; color: var(--text-green); margin-bottom: 8px; letter-spacing: 2px; }
    .mercator-coords { display: flex; justify-content: space-around; margin-bottom: 12px; }
    .coord-item { text-align: center; }
    .coord-label { font-size: 11px; color: var(--accent-green); margin-bottom: 4px; }
    .coord-value { font-size: 18px; color: var(--tick-color); font-weight: bold; letter-spacing: 1px; }
    .gps-info { border-top: 1px solid var(--primary-green); padding-top: 10px; margin-top: 5px; }
    .gps-label { font-size: 10px; color: var(--accent-green); margin-bottom: 4px; }
    .gps-coords { font-size: 13px; color: var(--text-color); text-align: center; }
    .compass-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: relative; }
    .compass-wrapper { position: relative; width: 90vmin; height: 90vmin; max-width: 400px; max-height: 400px; }
    .compass-dial { position: absolute; width: 100%; height: 100%; will-change: transform; }
    #compassCanvas { width: 100%; height: 100%; }
    .center-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none; }
    .indicator-arrow { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 25px solid var(--highlight-red); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .indicator-center { width: 8px; height: 8px; background: var(--highlight-red); border-radius: 50%; margin: -5px auto 0; }
    .bearing-display { margin-top: 15px; text-align: center; }
    .bearing-label { font-size: 12px; color: var(--text-green); letter-spacing: 2px; }
    .bearing-value { font-size: 36px; font-weight: bold; color: var(--tick-color); letter-spacing: 3px; }
    .bearing-unit { font-size: 16px; color: var(--accent-green); margin-left: 8px; }
    .converter-panel { width: 100%; padding: 12px; background: linear-gradient(180deg, #1a2a1a 0%, #0d150d 100%); border: 1px solid var(--primary-green); border-radius: 8px; margin-top: 15px; }
    .converter-title { font-size: 11px; color: var(--text-green); margin-bottom: 10px; letter-spacing: 1px; text-align: center; }
    .converter-row { display: flex; align-items: center; justify-content: space-around; gap: 10px; }
    .converter-input-group { flex: 1; text-align: center; }
    .converter-label { font-size: 10px; color: var(--accent-green); margin-bottom: 4px; }
    .converter-input { width: 100%; padding: 8px 5px; background: #0a0f0a; border: 1px solid var(--primary-green); border-radius: 4px; color: var(--tick-color); font-family: 'Courier New', monospace; font-size: 16px; text-align: center; }
    .converter-input:focus { outline: none; border-color: var(--accent-green); }
    .converter-btn { padding: 10px 12px; background: var(--primary-green); color: white; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .converter-btn:active { background: var(--accent-green); }
    .converter-result { font-size: 11px; color: var(--text-color); text-align: center; margin-top: 8px; }
    .copyright { position: fixed; bottom: 5px; left: 0; right: 50px; text-align: center; font-size: 10px; color: var(--accent-green); opacity: 0.7; }
    .fullscreen-btn { position: fixed; bottom: 8px; right: 8px; width: 40px; height: 40px; background: var(--primary-green); border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer; z-index: 50; opacity: 0.7; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; }
    .fullscreen-btn:hover { opacity: 1; }
    .status-message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 1px solid var(--highlight-red); padding: 20px 30px; border-radius: 10px; text-align: center; z-index: 100; display: none; max-width: 80%; }
    .status-message.show { display: block; }
    .status-message p { font-size: 14px; line-height: 1.6; margin-bottom: 15px; white-space: pre-line; }
    .status-message button { background: var(--primary-green); color: white; border: none; padding: 12px 30px; font-size: 14px; cursor: pointer; border-radius: 5px; font-family: inherit; }
    .tap-hint { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--accent-green); letter-spacing: 1px; animation: pulse 2s infinite; display: none; z-index: 50; }
    .tap-hint.show { display: block; }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="coords-panel">
      <div class="mercator-title">高斯-克吕格平面坐标 (6度分带)</div>
      <div class="mercator-coords">
        <div class="coord-item"><div class="coord-label">X (北向)</div><div class="coord-value" id="mercatorX">------</div></div>
        <div class="coord-item"><div class="coord-label">Y (东向)</div><div class="coord-value" id="mercatorY">------</div></div>
      </div>
      <div class="gps-info">
        <div class="gps-label">WGS84 经纬度 (精度: <span id="gpsAccuracy">--</span>m)</div>
        <div class="gps-coords" id="gpsCoords">正在获取坐标...</div>
        <div class="gps-coords" id="gpsUpdate" style="font-size:11px; color:#4a7c4a; margin-top:4px;"></div>
      </div>
    </div>
    <div class="compass-container">
      <div class="compass-wrapper">
        <div class="compass-dial" id="compassDial"><canvas id="compassCanvas"></canvas></div>
        <div class="center-indicator"><div class="indicator-arrow"></div><div class="indicator-center"></div></div>
      </div>
      <div class="bearing-display">
        <div class="bearing-label">当 前 方 位</div>
        <div><span class="bearing-value" id="bearingValue">----</span><span class="bearing-unit">密位</span></div>
      </div>
      <div class="converter-panel">
        <div class="converter-title">角 度 / 密 位 转 换</div>
        <div class="converter-row">
          <div class="converter-input-group"><div class="converter-label">角 度 (°)</div><input type="number" class="converter-input" id="inputDegrees" placeholder="0"></div>
          <button class="converter-btn" id="btnDegToMil">换算→</button>
          <div class="converter-input-group"><div class="converter-label">密 位 (mil)</div><input type="number" class="converter-input" id="inputMils" placeholder="0000"></div>
          <button class="converter-btn" id="btnMilToDeg">←换算</button>
        </div>
        <div class="converter-result" id="converterResult"></div>
      </div>
    </div>
    <div class="copyright">© 2026 🔥 黄羊滩 v0.0.1 · 指南针支持安卓浏览器</div>
    <button class="fullscreen-btn" id="fullscreenBtn" title="全屏显示">⛶</button>
  </div>
  <div class="status-message" id="statusMessage"><p id="statusText"></p><button id="statusBtn">确定</button></div>
  <div class="tap-hint" id="tapHint">点击屏幕获取罗盘权限</div>

  <script>
    const state = { heading: 0, latitude: null, longitude: null, accuracy: null, hasPermission: false, useAbsolute: 'absolute' in DeviceOrientationEvent ? true : false };
    const elements = { compassDial: document.getElementById('compassDial'), compassCanvas: document.getElementById('compassCanvas'), mercatorX: document.getElementById('mercatorX'), mercatorY: document.getElementById('mercatorY'), gpsCoords: document.getElementById('gpsCoords'), gpsAccuracy: document.getElementById('gpsAccuracy'), gpsUpdate: document.getElementById('gpsUpdate'), bearingValue: document.getElementById('bearingValue'), statusMessage: document.getElementById('statusMessage'), statusText: document.getElementById('statusText'), statusBtn: document.getElementById('statusBtn'), tapHint: document.getElementById('tapHint') };
    let ctx, canvasSize = 0, dialRadius = 0;
    const GK_A = 6378137.0, GK_F = 1 / 298.257222101, GK_B = GK_A * (1 - GK_F);
    const GK_E2 = (GK_A * GK_A - GK_B * GK_B) / (GK_A * GK_A);
    const GK_EP2 = (GK_A * GK_A - GK_B * GK_B) / (GK_B * GK_B);

    function latLonToGaussKruger(latDeg, lonDeg) {
      const B = latDeg * Math.PI / 180, zone = Math.floor(lonDeg / 6) + 1, L0 = (zone * 6 - 3) * Math.PI / 180;
      const l = lonDeg * Math.PI / 180 - L0, sinB = Math.sin(B), cosB = Math.cos(B), tanB = Math.tan(B);
      const W = Math.sqrt(1 - GK_E2 * sinB * sinB), N = GK_A / W, t = tanB, t2 = t * t, t4 = t2 * t2;
      const eta2 = GK_EP2 * cosB * cosB;
      const m0 = 1 + 3*GK_E2/4 + 45*GK_E2*GK_E2/64 + 175*GK_E2*GK_E2*GK_E2/256 + 11025*GK_E2*GK_E2*GK_E2*GK_E2/16384;
      const m2 = -(3*GK_E2/8 + 15*GK_E2*GK_E2/32 + 525*GK_E2*GK_E2*GK_E2/1024 + 2205*GK_E2*GK_E2*GK_E2*GK_E2/4096);
      const m4 = (15*GK_E2*GK_E2/256 + 105*GK_E2*GK_E2*GK_E2/1024 + 2205*GK_E2*GK_E2*GK_E2*GK_E2/16384);
      const m6 = -(35*GK_E2*GK_E2*GK_E2/3072 + 315*GK_E2*GK_E2*GK_E2*GK_E2/12288);
      const X0 = GK_A*(1-GK_E2)*(m0*B + m2*Math.sin(2*B) + m4*Math.sin(4*B) + m6*Math.sin(6*B));
      const l2 = l*l, l4 = l2*l2;
      const x = X0 + N*sinB*cosB*l2/2 + N*sinB*Math.pow(cosB,3)*(5-t2+9*eta2+4*eta2*eta2)*l4/24;
      const yEast = N*cosB*l + N*Math.pow(cosB,3)*(1-t2+eta2)*l2*l/6 + N*Math.pow(cosB,5)*(5-18*t2+t4)*l4*l/120;
      return { x: x, y: zone*1000000 + 500000 + yEast, zone: zone };
    }

    function degreesToMils(degrees) { return Math.round(((degrees % 360 + 360) % 360) * 6000 / 360).toString().padStart(4, '0'); }

    function drawCompass() {
      if (!ctx) return; const cx = canvasSize / 2, cy = canvasSize / 2;
      ctx.clearRect(0, 0, canvasSize, canvasSize);
      ctx.beginPath(); ctx.arc(cx, cy, dialRadius, 0, Math.PI * 2); ctx.strokeStyle = '#3a5a3a'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, dialRadius - 15, 0, Math.PI * 2); ctx.strokeStyle = '#2a4a2a'; ctx.lineWidth = 1; ctx.stroke();
      for (let mils = 0; mils < 6000; mils += 50) {
        const angle = (mils / 6000) * Math.PI * 2 - Math.PI / 2, isMain = mils % 500 === 0, isSecondary = mils % 100 === 0;
        const tickLength = isMain ? 25 : (isSecondary ? 15 : 8), innerR = dialRadius - tickLength, outerR = dialRadius - 2;
        const x1 = cx + Math.cos(angle) * innerR, y1 = cy + Math.sin(angle) * innerR;
        const x2 = cx + Math.cos(angle) * outerR, y2 = cy + Math.sin(angle) * outerR;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
        ctx.strokeStyle = isMain ? '#ffffff' : (isSecondary ? '#cccccc' : '#888888');
        ctx.lineWidth = isMain ? 3 : (isSecondary ? 2 : 1); ctx.stroke();
        if (isMain) { ctx.font = 'bold 24px Courier New'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(mils.toString(), cx + Math.cos(angle) * (dialRadius - 45), cy + Math.sin(angle) * (dialRadius - 45)); }
      }
      ctx.font = 'bold 28px Courier New'; ctx.fillStyle = '#ff4444'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('N', cx + Math.cos(-Math.PI/2) * (dialRadius - 75), cy + Math.sin(-Math.PI/2) * (dialRadius - 75));
    }

    function initCanvas() {
      const canvas = elements.compassCanvas, wrapper = canvas.parentElement, size = Math.min(wrapper.clientWidth, wrapper.clientHeight);
      canvasSize = size * 2; canvas.width = canvasSize; canvas.height = canvasSize;
      canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
      ctx = canvas.getContext('2d'); dialRadius = canvasSize / 2 - 40; drawCompass();
    }

    function updateCompass() { elements.compassDial.style.transform = `rotate(${-state.heading}deg)`; elements.bearingValue.textContent = degreesToMils(state.heading); }

    function updateCoords(accuracy) {
      if (state.latitude !== null && state.longitude !== null) {
        const gk = latLonToGaussKruger(state.latitude, state.longitude);
        elements.mercatorX.textContent = Math.round(gk.x); elements.mercatorY.textContent = Math.round(gk.y);
        elements.gpsCoords.textContent = `${state.latitude.toFixed(6)}°N, ${state.longitude.toFixed(6)}°E (带${gk.zone})`;
        if (accuracy !== undefined) elements.gpsAccuracy.textContent = accuracy.toFixed(0);
        elements.gpsUpdate.textContent = `更新: ${new Date().toLocaleTimeString('zh-CN')}`;
      }
    }

    function handleOrientation(event) {
      let heading = 0, isValid = false;
      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null && event.webkitCompassHeading >= 0) { heading = event.webkitCompassHeading; isValid = true; }
      else if (event.alpha !== null && event.alpha >= 0) { heading = event.alpha; if (!state.useAbsolute && !event.webkitCompassHeading) heading = 360 - heading; isValid = true; }
      if (!isValid) return;
      state.heading = ((heading % 360) + 360) % 360; updateCompass();
    }

    function handlePosition(position) { state.latitude = position.coords.latitude; state.longitude = position.coords.longitude; updateCoords(position.coords.accuracy); }
    function handlePositionError(error) { elements.gpsCoords.textContent = error.code === 1 ? '请授权位置权限' : 'GPS信号弱'; }
    function showStatus(message) { elements.statusText.textContent = message; elements.statusMessage.classList.add('show'); }
    function hideStatus() { elements.statusMessage.classList.remove('show'); }

    async function requestCompassPermission() {
      try { if (typeof DeviceOrientationEvent.requestPermission === 'function') { const permission = await DeviceOrientationEvent.requestPermission(); if (permission !== 'granted') { showStatus('请在系统设置中允许浏览器访问传感器'); return false; } } return true; } catch (err) { showStatus('权限请求失败'); return false; }
    }

    function initGeolocation() { if ('geolocation' in navigator) { const opts = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }; navigator.geolocation.getCurrentPosition(handlePosition, handlePositionError, opts); navigator.geolocation.watchPosition(handlePosition, handlePositionError, opts); } else { elements.gpsCoords.textContent = '设备不支持GPS'; } }

    function initCompass() {
      if (!('DeviceOrientationEvent' in window)) { showStatus('设备不支持罗盘功能'); return; }
      elements.tapHint.textContent = '点击屏幕获取罗盘权限'; elements.tapHint.classList.add('show');
      const onFirstClick = async function() {
        document.body.removeEventListener('click', onFirstClick);
        elements.tapHint.textContent = '正在获取权限...';
        const granted = await requestCompassPermission();
        if (!granted) { elements.tapHint.textContent = '点击重试'; elements.tapHint.classList.add('show'); document.body.addEventListener('click', onFirstClick); return; }
        state.hasPermission = true;
        const handleWithCheck = function(e) { handleOrientation(e); };
        if (state.useAbsolute) window.addEventListener('deviceorientationabsolute', handleWithCheck);
        window.addEventListener('deviceorientation', handleWithCheck);
        setTimeout(() => {
          if (state.heading === 0) {
            elements.tapHint.classList.remove('show');
            showStatus('罗盘数据获取失败\n\n可能原因：\n1. 浏览器权限未开启\n2. 鸿蒙系统限制浏览器访问传感器\n3. 传感器被其他应用占用\n\n解决方案：\n• 在系统设置中检查浏览器权限\n• 关闭其他使用传感器的应用\n• 使用系统自带指南针应用');
          } else {
            elements.tapHint.textContent = '传感器已激活';
            setTimeout(() => elements.tapHint.classList.remove('show'), 2000);
          }
        }, 5000);
      };
      document.body.addEventListener('click', onFirstClick);
    }

    function initConverter() {
      const inputDeg = document.getElementById('inputDegrees');
      const inputMil = document.getElementById('inputMils');
      const btnDegToMil = document.getElementById('btnDegToMil');
      const btnMilToDeg = document.getElementById('btnMilToDeg');
      const result = document.getElementById('converterResult');
      function degToMils(deg) { let d = ((deg % 360) + 360) % 360; return Math.round(d * 6000 / 360) % 6000; }
      function milsToDeg(mils) { let m = mils % 6000; return (m * 360 / 6000).toFixed(2); }
      btnDegToMil.addEventListener('click', () => { const deg = parseFloat(inputDeg.value); if (!isNaN(deg)) { const mils = degToMils(deg); inputMil.value = mils.toString().padStart(4, '0'); result.textContent = `${deg}° = ${mils} 密位`; } });
      btnMilToDeg.addEventListener('click', () => { const mils = parseInt(inputMil.value); if (!isNaN(mils)) { const deg = milsToDeg(mils); inputDeg.value = deg; result.textContent = `${mils} 密位 = ${deg}°`; } });
      inputDeg.addEventListener('keypress', (e) => { if (e.key === 'Enter') btnDegToMil.click(); });
      inputMil.addEventListener('keypress', (e) => { if (e.key === 'Enter') btnMilToDeg.click(); });
    }

    function initFullscreen() {
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => { fullscreenBtn.textContent = '⛶'; }).catch(err => { console.log('全屏失败:', err); });
        } else {
          document.exitFullscreen().then(() => { fullscreenBtn.textContent = '⛶'; }).catch(err => { console.log('退出全屏失败:', err); });
        }
      });
      document.addEventListener('fullscreenchange', () => { const btn = document.getElementById('fullscreenBtn'); btn.textContent = document.fullscreenElement ? '⛶' : '⛶'; });
    }

    function init() { initCanvas(); initGeolocation(); initCompass(); initFullscreen(); window.addEventListener('resize', initCanvas); elements.statusBtn.addEventListener('click', hideStatus); updateCompass(); initConverter(); }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
