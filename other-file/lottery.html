<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>纸条抽签 · 拟真动画版</title>
<style>
  :root {
    --bg: #f1dfbd;
    --bg2: #dbc192;
    --ink: #3a281c;
    --muted: #80684d;
    --rule: #c2a36f;
    --accent: #ad432c;
    --accent2: #5d794e;
    --paper: #fffdf3;
    --paper-edge: #ead9b4;
    --shadow: rgba(49, 31, 13, .28);
    --deep-shadow: rgba(35, 21, 8, .48);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.45), transparent 34%),
      radial-gradient(circle at 80% 88%, rgba(130,80,30,.18), transparent 42%),
      linear-gradient(180deg, #f6ead0 0%, var(--bg) 100%);
    user-select: none;
    -webkit-user-select: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(70, 44, 20, .025) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(-45deg, rgba(70, 44, 20, .018) 0 1px, transparent 1px 12px);
    pointer-events: none;
    z-index: 0;
  }

  .screen {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    transition: opacity .55s ease, filter .55s ease, transform .55s ease;
  }
  .screen.hidden {
    opacity: 0;
    pointer-events: none;
    filter: blur(5px);
    transform: scale(.985);
  }

  .btn {
    border: 0;
    border-radius: 999px;
    padding: 11px 22px;
    background: var(--accent);
    color: #fffaf0;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(173, 67, 44, .28), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 9px 22px rgba(173, 67, 44, .36); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.secondary { background: rgba(255,253,243,.85); color: var(--ink); box-shadow: 0 4px 12px rgba(60,35,10,.15); }
  .btn.green { background: var(--accent2); box-shadow: 0 6px 16px rgba(93, 121, 78, .3); }
  .btn:disabled { opacity: .5; pointer-events: none; }

  /* 开始页：就是一张可输入的纸 */
  .setup-screen {
    align-items: center;
    justify-content: center;
    padding: 22px;
  }
  .single-paper {
    position: relative;
    width: min(86vw, 360px);
    min-height: 450px;
    padding: 44px 34px 34px;
    border: 1px solid var(--paper-edge);
    border-radius: 7px 12px 8px 10px;
    background:
      linear-gradient(transparent 0, transparent calc(1.7em - 1px), rgba(105,78,45,.09) calc(1.7em - 1px), rgba(105,78,45,.09) 1.7em),
      linear-gradient(105deg, rgba(255,255,255,.65), transparent 26%),
      var(--paper);
    background-size: 100% 1.7em, 100% 100%, 100% 100%;
    box-shadow:
      0 24px 55px var(--shadow),
      inset 0 0 30px rgba(180,130,60,.08);
    text-align: center;
    transform: rotate(-1.4deg);
  }
  .single-paper::before {
    content: "";
    position: absolute;
    right: -1px;
    top: -1px;
    width: 46px;
    height: 46px;
    background: linear-gradient(135deg, transparent 49%, #efe0bb 50%, #dcc394 100%);
    border-radius: 0 12px 0 8px;
    box-shadow: -3px 3px 8px rgba(80,45,15,.12);
  }
  .single-paper h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    letter-spacing: .08em;
  }
  .single-paper p {
    color: var(--muted);
    font-size: .92rem;
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .count-box {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .count-box input {
    width: 104px;
    height: 52px;
    text-align: center;
    border: 2px solid var(--rule);
    border-radius: 12px;
    outline: 0;
    background: rgba(245,226,185,.65);
    color: var(--ink);
    font-size: 1.45rem;
    font-weight: 800;
    font-family: inherit;
  }

  /* 编辑区 */
  .edit-screen {
    padding: 0;
    background: transparent;
  }
  .topbar {
    flex: 0 0 auto;
    min-height: 66px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(255,253,243,.78);
    border-bottom: 1px solid rgba(130,95,50,.25);
    backdrop-filter: blur(10px);
    z-index: 5;
  }
  .topbar h2 { font-size: 1.05rem; }
  .topbar small { color: var(--muted); font-weight: 500; }
  .topbar .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .topbar .btn { padding: 8px 15px; font-size: .82rem; }

  .worktable {
    flex: 1;
    position: relative;
    overflow-y: auto;
    padding: 34px 18px 96px;
    background:
      radial-gradient(ellipse at 24% 10%, rgba(255,246,220,.42), transparent 50%),
      linear-gradient(90deg, rgba(93,58,24,.04) 1px, transparent 1px),
      linear-gradient(0deg, rgba(93,58,24,.035) 1px, transparent 1px),
      linear-gradient(180deg, #d7b173, #b88d52);
    background-size: auto, 46px 46px, 46px 46px, auto;
  }
  .paper-grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 18px;
  }

  .slip {
    position: relative;
    aspect-ratio: 3 / 4;
    padding: 18px 13px 12px;
    border: 1px solid var(--paper-edge);
    border-radius: 4px 8px 5px 7px;
    background:
      linear-gradient(transparent 0, transparent calc(1.5em - 1px), rgba(105,78,45,.08) calc(1.5em - 1px), rgba(105,78,45,.08) 1.5em),
      radial-gradient(circle at 18% 15%, rgba(255,255,255,.7), transparent 38%),
      var(--paper);
    background-size: 100% 1.5em, 100% 100%, 100% 100%;
    box-shadow: 0 10px 20px rgba(45,26,10,.22);
    transform: rotate(var(--r));
    cursor: pointer;
    overflow: hidden;
    transition: transform .22s ease, box-shadow .22s ease;
    animation: settleIn .72s cubic-bezier(.2,.9,.2,1.1) both;
  }
  .slip::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(118deg, transparent 0 66%, rgba(120,80,35,.06) 67%, transparent 78%);
    pointer-events: none;
  }
  .slip:hover { transform: rotate(0deg) translateY(-5px) scale(1.025); box-shadow: 0 15px 28px rgba(45,26,10,.3); }
  .slip-num {
    position: absolute;
    top: 6px;
    right: 9px;
    color: var(--muted);
    font-size: .72rem;
    font-weight: 800;
  }
  .slip-text {
    height: 100%;
    overflow: hidden;
    font-size: .84rem;
    line-height: 1.5em;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .empty { color: var(--muted); font-style: italic; }

  @keyframes settleIn {
    from { opacity: 0; transform: translate(var(--from-x), var(--from-y)) rotate(var(--r)) scale(.62); }
    68% { opacity: 1; transform: translate(0, 0) rotate(var(--r)) scale(1.04); }
    to { opacity: 1; transform: translate(0, 0) rotate(var(--r)) scale(1); }
  }

  /* 电影式动画层 */
  .cinema {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 28%, rgba(255,251,235,.45), transparent 36%),
      linear-gradient(180deg, rgba(246,234,208,.95), rgba(210,171,110,.96));
  }
  .cinema.show { display: block; }
  .cinema-note {
    position: absolute;
    left: 50%;
    top: 8%;
    transform: translateX(-50%);
    width: min(90vw, 520px);
    text-align: center;
    color: var(--ink);
    z-index: 5;
  }
  .cinema-note h2 { font-size: 1.35rem; margin-bottom: 6px; }
  .cinema-note p { color: var(--muted); font-size: .9rem; }

  .cut-paper {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(68vw, 340px);
    height: min(88vw, 440px);
    max-height: 62vh;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 22px 38px rgba(50,30,10,.28));
  }
  .cut-piece {
    position: absolute;
    border: 1px solid rgba(190,160,110,.85);
    background:
      linear-gradient(transparent 0, transparent calc(1.42em - 1px), rgba(105,78,45,.075) calc(1.42em - 1px), rgba(105,78,45,.075) 1.42em),
      radial-gradient(circle at 20% 16%, rgba(255,255,255,.75), transparent 38%),
      var(--paper);
    background-size: 100% 1.42em, 100% 100%, 100% 100%;
    transform-origin: 50% 50%;
    transition: transform 1s cubic-bezier(.2,.72,.18,1), opacity .8s ease, border-radius .8s ease;
  }
  .cut-line-h, .cut-line-v {
    position: absolute;
    background: rgba(133,83,39,.42);
    box-shadow: 0 0 9px rgba(173,67,44,.35);
    opacity: 0;
    z-index: 4;
  }
  .cut-line-h { height: 2px; left: 0; right: 0; animation: drawLine .52s ease both; }
  .cut-line-v { width: 2px; top: 0; bottom: 0; animation: drawLine .52s ease both; }
  @keyframes drawLine {
    from { opacity: 0; transform: scaleX(.08); }
    40% { opacity: 1; }
    to { opacity: 0; transform: scaleX(1); }
  }

  .crumple-piece {
    position: fixed;
    z-index: 1020;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 25% 20%, #fffef7 0 11%, transparent 12%),
      radial-gradient(circle at 36% 33%, #fff8dd 0 25%, #ead39d 50%, #b99057 100%);
    box-shadow: inset -8px -7px 12px rgba(70,43,18,.32), inset 8px 6px 12px rgba(255,255,255,.32), 0 10px 18px rgba(42,23,8,.3);
    transform: translate(-50%, -50%) scale(.2);
    transition: left .8s cubic-bezier(.34,1.2,.38,1), top .8s cubic-bezier(.34,1.2,.38,1), transform .8s cubic-bezier(.34,1.2,.38,1), opacity .5s ease;
  }
  .crumple-piece::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background:
      linear-gradient(40deg, transparent 30%, rgba(86,55,25,.16) 31% 34%, transparent 35%),
      linear-gradient(120deg, transparent 20%, rgba(86,55,25,.14) 21% 26%, transparent 27%),
      repeating-radial-gradient(circle at 55% 55%, transparent 0 5px, rgba(80,55,24,.08) 5px 7px);
  }

  .basket-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(86vw, 520px);
    height: min(72vw, 420px);
    transform: translate(-50%, -43%);
  }
  .cinema-basket-wrap {
    position: absolute;
    left: 50%;
    top: 56%;
    width: 300px;
    height: 210px;
    transform: translate(-50%, -50%) scale(.9);
    z-index: 1010;
    opacity: 0;
    animation: basketFadeIn .45s ease .12s forwards;
  }
  .cinema-basket-wrap .basket {
    left: 50%;
    top: 50%;
  }
  @keyframes basketFadeIn {
    from { opacity: 0; transform: translate(-50%, -44%) scale(.78); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(.9); }
  }
  .basket {
    position: absolute;
    left: 50%;
    top: 55%;
    width: 260px;
    height: 180px;
    transform: translate(-50%, -50%) rotate(0deg);
    transform-origin: 50% 85%;
    transition: transform .75s ease;
  }
  .basket.shake { animation: basketShake .14s infinite; }
  .basket.pour { animation: basketPour 1.15s cubic-bezier(.4,0,.2,1) forwards; }
  .basket-rim {
    position: absolute;
    left: 10px;
    top: 18px;
    width: 240px;
    height: 68px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,244,207,.35) 0 40%, #8a5829 42% 48%, #c38a47 50% 100%);
    box-shadow: inset 0 7px 16px rgba(255,240,205,.32), 0 7px 12px rgba(48,28,10,.25);
    z-index: 3;
  }
  .basket-body {
    position: absolute;
    left: 30px;
    top: 50px;
    width: 200px;
    height: 130px;
    border-radius: 18px 18px 80px 80px;
    background:
      repeating-linear-gradient(90deg, rgba(89,52,21,.3) 0 8px, transparent 8px 18px),
      repeating-linear-gradient(0deg, rgba(255,230,170,.18) 0 6px, transparent 6px 18px),
      linear-gradient(180deg, #c88b48, #8d5729);
    box-shadow: inset 0 -20px 30px rgba(45,25,8,.32), 0 18px 30px rgba(45,25,8,.34);
    z-index: 2;
  }
  .basket-shadow {
    position: absolute;
    left: 50%;
    bottom: 12px;
    width: 260px;
    height: 34px;
    border-radius: 50%;
    transform: translateX(-50%);
    background: rgba(55,32,11,.22);
    filter: blur(6px);
  }
  .basket .crumple-piece {
    position: absolute;
    z-index: 4;
  }

  @keyframes basketShake {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    25% { transform: translate(calc(-50% - 10px), calc(-50% - 4px)) rotate(-4deg); }
    50% { transform: translate(calc(-50% + 8px), calc(-50% + 5px)) rotate(4deg); }
    75% { transform: translate(calc(-50% - 4px), calc(-50% + 3px)) rotate(-2deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
  }
  @keyframes basketPour {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    45% { transform: translate(-52%, -56%) rotate(-26deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
  }

  .shake-screen {
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 28%, rgba(255,246,220,.35), transparent 40%),
      linear-gradient(180deg, #f2dfbd, #d6ae70);
  }
  .shake-actions {
    position: absolute;
    bottom: 5.5%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    width: min(92vw, 560px);
  }
  .shake-actions .btn { padding: 10px 18px; font-size: .86rem; }

  .table-screen { padding: 0; }
  .table-area {
    position: relative;
    flex: 1;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 26% 16%, rgba(255,246,220,.42), transparent 48%),
      linear-gradient(90deg, rgba(78,45,17,.06) 1px, transparent 1px),
      linear-gradient(0deg, rgba(78,45,17,.045) 1px, transparent 1px),
      linear-gradient(180deg, #d7b173, #b98d52);
    background-size: auto, 52px 52px, 52px 52px, auto;
  }
  .table-ball {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 24% 18%, #fffef7 0 11%, transparent 12%),
      radial-gradient(circle at 35% 32%, #fff6d9 0 25%, #e5cc92 54%, #a9743c 100%);
    box-shadow: inset -8px -7px 12px rgba(70,43,18,.35), inset 8px 6px 12px rgba(255,255,255,.28), 0 9px 14px rgba(42,23,8,.35);
    cursor: pointer;
    transform: translate(-50%, -50%) scale(0);
    animation: scatterLand 1.05s cubic-bezier(.2,.8,.18,1.18) both;
    transition: transform .18s ease, opacity .38s ease;
  }
  .table-ball::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background:
      linear-gradient(36deg, transparent 26%, rgba(78,52,24,.16) 27% 31%, transparent 32%),
      linear-gradient(125deg, transparent 18%, rgba(78,52,24,.14) 19% 25%, transparent 26%),
      repeating-radial-gradient(circle at 54% 58%, transparent 0 5px, rgba(80,55,24,.08) 5px 7px);
  }
  .table-ball:hover { transform: translate(-50%, -50%) scale(1.14) !important; }
  .table-ball.taken { opacity: 0; transform: translate(-50%, -50%) scale(.18) !important; pointer-events: none; }
  @keyframes scatterLand {
    0% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(.6) rotate(0deg); }
    52% { opacity: 1; transform: translate(-50%, calc(-50% - 16px)) scale(1.12) rotate(var(--rot)); }
    74% { transform: translate(-50%, calc(-50% + 4px)) scale(.94) rotate(var(--rot)); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(var(--rot)); }
  }

  /* 编辑和查看模态 */
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 2100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(36,22,8,.58);
    backdrop-filter: blur(3px);
  }
  .modal-mask.show { display: flex; animation: fadeIn .25s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-paper {
    position: relative;
    width: min(92vw, 430px);
    min-height: 280px;
    padding: 28px 24px 22px;
    border: 1px solid var(--paper-edge);
    border-radius: 6px 10px 7px 9px;
    background:
      linear-gradient(transparent 0, transparent calc(1.75em - 1px), rgba(105,78,45,.08) calc(1.75em - 1px), rgba(105,78,45,.08) 1.75em),
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.68), transparent 34%),
      var(--paper);
    background-size: 100% 1.75em, 100% 100%, 100% 100%;
    box-shadow: 0 26px 60px rgba(20,12,4,.46);
    animation: paperOpen .5s cubic-bezier(.23,1.25,.3,1) both;
  }
  @keyframes paperOpen {
    from { opacity: 0; transform: perspective(800px) rotateX(65deg) scale(.65); filter: blur(2px); }
    to { opacity: 1; transform: perspective(800px) rotateX(0) scale(1); filter: blur(0); }
  }
  .modal-paper h3 { font-size: 1.05rem; margin-bottom: 14px; display: inline-block; border-bottom: 2px solid var(--accent); padding-bottom: 7px; }
  .modal-paper textarea {
    width: 100%;
    min-height: 145px;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.75em;
  }
  .display-content {
    min-height: 145px;
    color: var(--ink);
    font-size: 1rem;
    line-height: 1.75em;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .modal-actions { margin-top: 18px; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  .modal-actions .btn { padding: 9px 18px; font-size: .86rem; }

  /* 手拾取并展开动画 */
  .pickup-layer {
    position: fixed;
    inset: 0;
    z-index: 2050;
    pointer-events: none;
    display: none;
    background: rgba(30,18,7,.14);
  }
  .pickup-layer.show { display: block; }
  .ghost-ball {
    position: fixed;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 24% 18%, #fffef7 0 11%, transparent 12%),
      radial-gradient(circle at 35% 32%, #fff6d9 0 25%, #e5cc92 54%, #a9743c 100%);
    box-shadow: inset -8px -7px 12px rgba(70,43,18,.35), 0 12px 20px rgba(35,20,8,.35);
    transform: translate(-50%, -50%);
    z-index: 2;
  }
  .hand {
    position: fixed;
    width: 155px;
    height: 130px;
    left: 50%;
    top: 110%;
    transform: translate(-50%, -50%) rotate(-14deg);
    z-index: 3;
  }
  .hand .palm {
    position: absolute;
    right: 8px;
    bottom: 0;
    width: 88px;
    height: 78px;
    border-radius: 48px 42px 34px 42px;
    background: linear-gradient(145deg, #f4c08f, #d9925b);
    box-shadow: inset -10px -8px 14px rgba(105,55,20,.2), 0 10px 18px rgba(35,20,8,.25);
  }
  .finger {
    position: absolute;
    width: 24px;
    height: 82px;
    border-radius: 18px;
    background: linear-gradient(160deg, #f7c99f, #dc985f);
    box-shadow: inset -5px -5px 8px rgba(105,55,20,.16);
    transform-origin: 50% 88%;
  }
  .finger.f1 { left: 42px; top: 5px; transform: rotate(-28deg); height: 88px; }
  .finger.f2 { left: 66px; top: -2px; transform: rotate(-10deg); height: 92px; }
  .finger.f3 { left: 91px; top: 5px; transform: rotate(8deg); height: 84px; }
  .finger.thumb { left: 100px; top: 48px; width: 28px; height: 64px; transform: rotate(60deg); }
  .unfold-paper {
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(86vw, 430px);
    height: min(62vh, 330px);
    border: 1px solid var(--paper-edge);
    border-radius: 6px;
    background:
      linear-gradient(transparent 0, transparent calc(1.75em - 1px), rgba(105,78,45,.08) calc(1.75em - 1px), rgba(105,78,45,.08) 1.75em),
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.72), transparent 34%),
      var(--paper);
    background-size: 100% 1.75em, 100% 100%, 100% 100%;
    box-shadow: 0 22px 55px rgba(20,12,4,.36);
    transform: translate(-50%, -50%) scale(.08) rotate(170deg);
    opacity: 0;
    z-index: 4;
  }

  .pickup-layer.run .hand { animation: handPick 1.35s cubic-bezier(.3,.9,.25,1) forwards; }
  .pickup-layer.run .ghost-ball { animation: ghostBallPick 1.35s cubic-bezier(.3,.9,.25,1) forwards; }
  .pickup-layer.run .unfold-paper { animation: unfoldSheet 1.35s cubic-bezier(.24,1.1,.28,1) forwards; }
  @keyframes handPick {
    0% { left: 58%; top: 118%; transform: translate(-50%, -50%) rotate(-18deg); }
    38% { left: var(--tx); top: var(--ty); transform: translate(-42%, -20%) rotate(-15deg); }
    60% { left: var(--tx); top: var(--ty); transform: translate(-42%, -20%) rotate(-15deg); }
    100% { left: 54%; top: 114%; transform: translate(-50%, -50%) rotate(-10deg); }
  }
  @keyframes ghostBallPick {
    0% { left: var(--tx); top: var(--ty); transform: translate(-50%, -50%) scale(1); opacity: 1; }
    45% { left: var(--tx); top: var(--ty); transform: translate(-50%, -50%) scale(.86); opacity: 1; }
    72% { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.2) rotate(130deg); opacity: .35; }
    100% { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.1) rotate(180deg); opacity: 0; }
  }
  @keyframes unfoldSheet {
    0%, 52% { opacity: 0; transform: translate(-50%, -50%) scale(.06) rotate(160deg) skew(12deg, 5deg); border-radius: 50%; }
    74% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(-4deg) skew(0); border-radius: 12px; }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0) skew(0); border-radius: 6px; }
  }

  .status {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 3000;
    transform: translate(-50%, -50%);
    padding: 12px 20px;
    border-radius: 999px;
    background: rgba(45,27,10,.86);
    color: #fffaf0;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    font-size: .92rem;
  }
  .status.show { opacity: 1; }

  @media (max-width: 520px) {
    .single-paper { min-height: 410px; padding: 38px 24px 28px; }
    .paper-grid { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 13px; }
    .slip { padding: 15px 10px 10px; }
    .slip-text { font-size: .76rem; }
    .basket { transform: translate(-50%, -50%) scale(.86); }
    .topbar { padding: 10px 12px; }
  }
</style>
</head>
<body>

<section class="screen setup-screen" id="screenSetup">
  <div class="single-paper" id="singlePaper">
    <h1>纸条抽签</h1>
    <p>先输入纸条数量，整张纸会被裁成对应数量。之后可逐张填写内容，再揉成纸团放进篮子里。</p>
    <div class="count-box">
      <label for="countInput">数量</label>
      <input id="countInput" type="number" min="1" max="80" value="6">
    </div>
    <button class="btn" id="btnMake">裁开纸张</button>
    <p style="font-size:.78rem;margin-top:18px;">建议 1 ~ 80 张；数量太多时会自动缩小动画纸团。</p>
  </div>
</section>

<section class="screen edit-screen hidden" id="screenEdit">
  <header class="topbar">
    <div>
      <h2>填写纸片 <small id="editCount"></small></h2>
    </div>
    <div class="buttons">
      <button class="btn secondary" id="btnBackSetup">返回</button>
      <button class="btn green" id="btnCrumple">开始：揉成纸团入篮</button>
    </div>
  </header>
  <main class="worktable">
    <div class="paper-grid" id="paperGrid"></div>
  </main>
</section>

<section class="screen shake-screen hidden" id="screenShake">
  <div class="cinema-note">
    <h2 id="shakeTitle">纸团已经装进篮子</h2>
    <p id="shakeText">摇晃手机或点击按钮，把篮子里的纸团撒到桌面上。</p>
  </div>
  <div class="basket-stage" id="basketStage">
    <div class="basket-shadow"></div>
    <div class="basket" id="basket">
      <div class="basket-rim"></div>
      <div class="basket-body"></div>
    </div>
  </div>
  <div class="shake-actions">
    <button class="btn secondary" id="btnBackEdit">返回编辑</button>
    <button class="btn" id="btnScatter">摇晃并撒出</button>
    <button class="btn green" id="btnEnableMotion" style="display:none;">开启重力感应</button>
  </div>
</section>

<section class="screen table-screen hidden" id="screenTable">
  <header class="topbar">
    <div>
      <h2>桌上的纸团 <small id="tableStats"></small></h2>
    </div>
    <div class="buttons">
      <button class="btn secondary" id="btnReshake">放回篮子重摇</button>
      <button class="btn green" id="btnRestart">重新开始</button>
    </div>
  </header>
  <main class="table-area" id="tableArea"></main>
</section>

<div class="cinema" id="cinema">
  <div class="cinema-note">
    <h2 id="cinemaTitle">正在裁开整张纸</h2>
    <p id="cinemaText">纸张会沿着分割线裁开，然后平铺到桌面。</p>
  </div>
  <div class="cut-paper" id="cutPaper"></div>
</div>

<div class="pickup-layer" id="pickupLayer">
  <div class="ghost-ball" id="ghostBall"></div>
  <div class="hand" id="hand">
    <div class="finger f1"></div>
    <div class="finger f2"></div>
    <div class="finger f3"></div>
    <div class="finger thumb"></div>
    <div class="palm"></div>
  </div>
  <div class="unfold-paper" id="unfoldPaper"></div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal-paper">
    <h3 id="modalTitle">编辑纸条</h3>
    <textarea id="modalTextarea" maxlength="500" placeholder="在这里写纸条内容..."></textarea>
    <div class="display-content" id="modalDisplay" style="display:none;"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="status" id="status"></div>

<script>
(function () {
  'use strict';

  var state = {
    count: 0,
    papers: [],
    currentId: null,
    shaking: false,
    motionEnabled: false,
    lastMotion: 0
  };

  function $(id) { return document.getElementById(id); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showToast(msg, dur) {
    var el = $('status');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, dur || 1500);
  }
  function showScreen(id) {
    ['screenSetup', 'screenEdit', 'screenShake', 'screenTable'].forEach(function (sid) {
      $(sid).classList.toggle('hidden', sid !== id);
    });
  }
  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  $('btnMake').addEventListener('click', function () {
    var n = parseInt($('countInput').value, 10);
    if (!n || n < 1) return showToast('请输入有效数量');
    if (n > 80) return showToast('最多 80 张，避免动画过密');
    state.count = n;
    state.papers = Array.from({ length: n }, function (_, i) {
      return { id: i, content: '', taken: false, x: 0, y: 0, rot: 0 };
    });
    runCutAnimation(n);
  });

  async function runCutAnimation(n) {
    $('cinemaTitle').textContent = '正在裁开整张纸';
    $('cinemaText').textContent = '一张纸会被分割成 ' + n + ' 个纸片，并落到桌面上。';
    $('cinema').classList.add('show');
    var box = $('cutPaper');
    box.innerHTML = '';

    var cols = Math.ceil(Math.sqrt(n * .78));
    var rows = Math.ceil(n / cols);
    var rect = box.getBoundingClientRect();
    var cw = rect.width / cols;
    var ch = rect.height / rows;

    for (var r = 1; r < rows; r++) {
      var h = document.createElement('div');
      h.className = 'cut-line-h';
      h.style.top = (r * ch) + 'px';
      h.style.animationDelay = (r * .07) + 's';
      box.appendChild(h);
    }
    for (var c = 1; c < cols; c++) {
      var v = document.createElement('div');
      v.className = 'cut-line-v';
      v.style.left = (c * cw) + 'px';
      v.style.animationDelay = (.18 + c * .06) + 's';
      box.appendChild(v);
    }

    var pieces = [];
    for (var i = 0; i < n; i++) {
      var rr = Math.floor(i / cols);
      var cc = i % cols;
      var p = document.createElement('div');
      p.className = 'cut-piece';
      p.style.left = (cc * cw) + 'px';
      p.style.top = (rr * ch) + 'px';
      p.style.width = cw + 'px';
      p.style.height = ch + 'px';
      p.dataset.id = i;
      box.appendChild(p);
      pieces.push(p);
    }

    await wait(760);
    $('cinemaTitle').textContent = '纸片正在铺开';
    pieces.forEach(function (p, i) {
      var angle = (i / n) * Math.PI * 2;
      var dx = Math.cos(angle) * rand(90, Math.min(window.innerWidth, 620) * .38) + rand(-45, 45);
      var dy = Math.sin(angle) * rand(70, Math.min(window.innerHeight, 520) * .28) + rand(-35, 35);
      p.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rand(-26, 26) + 'deg) scale(' + rand(.78, .94) + ')';
    });

    await wait(1000);
    buildGridFromCutPieces(pieces);
    showScreen('screenEdit');
    $('cinema').classList.remove('show');
    box.innerHTML = '';
  }

  function buildGridFromCutPieces(pieces) {
    var grid = $('paperGrid');
    grid.innerHTML = '';
    state.papers.forEach(function (paper, i) {
      var slip = document.createElement('div');
      slip.className = 'slip';
      slip.style.setProperty('--r', rand(-4, 4) + 'deg');
      slip.style.setProperty('--from-x', rand(-180, 180) + 'px');
      slip.style.setProperty('--from-y', rand(-150, 120) + 'px');
      slip.style.animationDelay = (i * .025) + 's';
      slip.dataset.id = paper.id;
      slip.innerHTML = '<span class="slip-num">#' + (i + 1) + '</span><div class="slip-text">' +
        (paper.content ? escapeHTML(paper.content) : '<span class="empty">点击写内容...</span>') + '</div>';
      slip.addEventListener('click', function () { openEdit(paper.id); });
      grid.appendChild(slip);
    });
    $('editCount').textContent = '共 ' + state.papers.length + ' 张';
  }

  function refreshGrid() { buildGridFromCutPieces([]); }

  $('btnBackSetup').addEventListener('click', function () {
    showScreen('screenSetup');
  });

  $('btnCrumple').addEventListener('click', function () {
    var hasContent = state.papers.some(function (p) { return p.content.trim(); });
    if (!hasContent && !confirm('所有纸片都是空白的，确定继续吗？')) return;
    runCrumpleIntoBasket();
  });

  async function runCrumpleIntoBasket() {
    $('cinemaTitle').textContent = '正在把纸片揉成纸团';
    $('cinemaText').textContent = '每张纸片会先收缩揉皱，再飞入篮子。';
    $('cinema').classList.add('show');
    $('cutPaper').innerHTML = '';

    var cinemaBasket = document.createElement('div');
    cinemaBasket.className = 'cinema-basket-wrap';
    cinemaBasket.innerHTML =
      '<div class="basket-shadow"></div>' +
      '<div class="basket">' +
        '<div class="basket-rim"></div>' +
        '<div class="basket-body"></div>' +
      '</div>';
    $('cinema').appendChild(cinemaBasket);

    var slips = Array.prototype.slice.call(document.querySelectorAll('.slip'));
    var basketPos = { x: window.innerWidth / 2, y: window.innerHeight * .55 };
    var ghosts = [];

    slips.forEach(function (slip, i) {
      var rect = slip.getBoundingClientRect();
      var g = document.createElement('div');
      g.className = 'crumple-piece';
      g.style.left = (rect.left + rect.width / 2) + 'px';
      g.style.top = (rect.top + rect.height / 2) + 'px';
      g.style.width = clamp(rect.width * .42, 34, 58) + 'px';
      g.style.height = clamp(rect.width * .42, 34, 58) + 'px';
      g.style.transitionDelay = (i * .018) + 's';
      $('cinema').appendChild(g);
      ghosts.push(g);
      slip.style.transition = 'transform .45s ease, opacity .35s ease, border-radius .45s ease';
      slip.style.transform += ' scale(.18) rotate(' + rand(90, 260) + 'deg)';
      slip.style.borderRadius = '50%';
      slip.style.opacity = '0';
    });

    await wait(140);
    ghosts.forEach(function (g, i) {
      g.style.left = (basketPos.x + rand(-58, 58)) + 'px';
      g.style.top = (basketPos.y + rand(-38, 28)) + 'px';
      g.style.transform = 'translate(-50%, -50%) scale(1) rotate(' + rand(160, 520) + 'deg)';
    });

    await wait(1050);
    ghosts.forEach(function (g) { g.remove(); });
    cinemaBasket.remove();
    showScreen('screenShake');
    setupBasketBalls();
    $('cinema').classList.remove('show');
    tryEnableMotion();
  }

  function setupBasketBalls() {
    var basket = $('basket');
    Array.prototype.slice.call(basket.querySelectorAll('.crumple-piece')).forEach(function (el) { el.remove(); });
    state.papers.forEach(function (p) {
      if (p.taken) return;
      var ball = document.createElement('div');
      ball.className = 'crumple-piece';
      ball.style.position = 'absolute';
      ball.style.width = clamp(58 - state.count * .25, 30, 52) + 'px';
      ball.style.height = ball.style.width;
      ball.style.left = rand(82, 178) + 'px';
      ball.style.top = rand(55, 108) + 'px';
      ball.style.transform = 'translate(-50%, -50%) scale(1) rotate(' + rand(0, 360) + 'deg)';
      ball.dataset.id = p.id;
      basket.appendChild(ball);
    });
    $('shakeTitle').textContent = '纸团已经装进篮子';
    $('shakeText').textContent = '摇晃手机或点击按钮，把篮子里的纸团撒到桌面上。';
  }

  $('btnBackEdit').addEventListener('click', function () {
    refreshGrid();
    showScreen('screenEdit');
  });
  $('btnScatter').addEventListener('click', scatterFromBasket);

  async function scatterFromBasket() {
    if (state.shaking) return;
    var available = state.papers.filter(function (p) { return !p.taken; });
    if (!available.length) return showToast('已经没有纸团啦');
    state.shaking = true;
    $('btnScatter').disabled = true;
    $('basket').classList.add('shake');
    $('shakeTitle').textContent = '正在摇晃篮子';
    $('shakeText').textContent = '纸团在篮子里滚动，马上会撒到桌上。';

    var balls = Array.prototype.slice.call($('basket').querySelectorAll('.crumple-piece'));
    var timer = setInterval(function () {
      balls.forEach(function (b) {
        b.style.left = rand(74, 188) + 'px';
        b.style.top = rand(48, 116) + 'px';
        b.style.transform = 'translate(-50%, -50%) scale(1) rotate(' + rand(0, 720) + 'deg)';
      });
    }, 110);

    await wait(1350);
    clearInterval(timer);
    $('basket').classList.remove('shake');
    $('basket').classList.add('pour');
    $('shakeTitle').textContent = '纸团撒到桌面';
    $('shakeText').textContent = '篮子倾倒，纸团会带着弹跳落在桌上。';
    await wait(620);
    $('basket').classList.remove('pour');
    showScreen('screenTable');
    renderTableBalls(true);
    $('btnScatter').disabled = false;
    state.shaking = false;
  }

  function renderTableBalls(fromBasket) {
    var area = $('tableArea');
    area.innerHTML = '';
    var rect = area.getBoundingClientRect();
    var W = Math.max(320, rect.width);
    var H = Math.max(260, rect.height);
    var available = state.papers.filter(function (p) { return !p.taken; });
    var positions = [];
    var minDist = clamp(62 - available.length * .35, 42, 62);

    available.forEach(function (p, i) {
      var x, y, ok, tries = 0;
      do {
        x = rand(42, W - 42);
        y = rand(44, H - 44);
        ok = true;
        for (var j = 0; j < positions.length; j++) {
          var dx = positions[j].x - x;
          var dy = positions[j].y - y;
          if (dx * dx + dy * dy < minDist * minDist) { ok = false; break; }
        }
        tries++;
      } while (!ok && tries < 90);
      positions.push({ x: x, y: y });
      p.x = x; p.y = y; p.rot = rand(-220, 220);

      var ball = document.createElement('div');
      ball.className = 'table-ball';
      ball.style.left = x + 'px';
      ball.style.top = y + 'px';
      ball.style.setProperty('--rot', p.rot + 'deg');
      ball.style.setProperty('--sx', fromBasket ? rand(-170, 70) + 'px' : '-50%');
      ball.style.setProperty('--sy', fromBasket ? rand(-330, -170) + 'px' : '-50%');
      ball.style.animationDelay = (i * .045) + 's';
      ball.dataset.id = p.id;
      ball.addEventListener('click', function () { pickUpAndOpen(p.id, ball); });
      area.appendChild(ball);
    });
    updateStats();
  }

  function updateStats() {
    var total = state.papers.length;
    var taken = state.papers.filter(function (p) { return p.taken; }).length;
    $('tableStats').textContent = '剩余 ' + (total - taken) + ' / 共 ' + total + '，已拿走 ' + taken;
  }

  $('btnReshake').addEventListener('click', function () {
    if (!state.papers.some(function (p) { return !p.taken; })) return showToast('已经没有纸团啦');
    showScreen('screenShake');
    setupBasketBalls();
  });
  $('btnRestart').addEventListener('click', function () {
    if (!confirm('重新开始会清空所有纸条内容，确定吗？')) return;
    state.papers = [];
    state.count = 0;
    showScreen('screenSetup');
  });

  function openEdit(id) {
    state.currentId = id;
    var p = state.papers[id];
    $('modalTitle').textContent = '编辑纸片 #' + (id + 1);
    $('modalTextarea').value = p.content || '';
    $('modalTextarea').style.display = '';
    $('modalDisplay').style.display = 'none';
    $('modalActions').innerHTML = '<button class="btn secondary" id="modalCancel">取消</button><button class="btn" id="modalSave">保存</button>';
    $('modalCancel').onclick = closeModal;
    $('modalSave').onclick = function () {
      state.papers[id].content = $('modalTextarea').value.trim();
      refreshGrid();
      closeModal();
    };
    $('modalMask').classList.add('show');
    setTimeout(function () { $('modalTextarea').focus(); }, 80);
  }

  async function pickUpAndOpen(id, ballEl) {
    if (ballEl.classList.contains('taken')) return;
    var rect = ballEl.getBoundingClientRect();
    var x = rect.left + rect.width / 2;
    var y = rect.top + rect.height / 2;
    var layer = $('pickupLayer');
    layer.style.setProperty('--tx', x + 'px');
    layer.style.setProperty('--ty', y + 'px');
    $('ghostBall').style.left = x + 'px';
    $('ghostBall').style.top = y + 'px';
    $('unfoldPaper').style.opacity = '0';
    layer.classList.add('show');
    layer.classList.remove('run');
    void layer.offsetWidth;
    layer.classList.add('run');
    ballEl.style.opacity = '0';
    await wait(1280);
    layer.classList.remove('show', 'run');
    openView(id, ballEl);
  }

  function openView(id, ballEl) {
    state.currentId = id;
    var p = state.papers[id];
    $('modalTitle').textContent = '纸条 #' + (id + 1);
    $('modalTextarea').style.display = 'none';
    $('modalDisplay').style.display = '';
    $('modalDisplay').classList.toggle('empty', !p.content.trim());
    $('modalDisplay').textContent = p.content.trim() ? p.content : '（这是一张空白纸条）';
    $('modalActions').innerHTML = '<button class="btn secondary" id="putBack">放回去</button><button class="btn" id="takeAway">拿走</button>';
    $('putBack').onclick = function () {
      ballEl.style.opacity = '1';
      closeModal();
      showToast('已放回桌上');
    };
    $('takeAway').onclick = function () {
      p.taken = true;
      ballEl.classList.add('taken');
      setTimeout(function () { ballEl.remove(); }, 420);
      updateStats();
      closeModal();
      var left = state.papers.filter(function (x) { return !x.taken; }).length;
      showToast(left ? '已拿走纸条 #' + (id + 1) : '所有纸条都被抽完啦', left ? 1400 : 2400);
    };
    $('modalMask').classList.add('show');
  }

  function closeModal() {
    $('modalMask').classList.remove('show');
    state.currentId = null;
  }
  $('modalMask').addEventListener('click', function (e) {
    if (e.target === $('modalMask')) closeModal();
  });

  function tryEnableMotion() {
    if (state.motionEnabled || typeof DeviceMotionEvent === 'undefined') return;
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      $('btnEnableMotion').style.display = '';
      $('btnEnableMotion').onclick = function () {
        DeviceMotionEvent.requestPermission().then(function (res) {
          if (res === 'granted') {
            attachMotion();
            $('btnEnableMotion').style.display = 'none';
            showToast('重力感应已开启');
          } else {
            showToast('未授权，点击按钮也可以抽签');
          }
        }).catch(function () { showToast('授权失败，点击按钮即可'); });
      };
    } else {
      attachMotion();
    }
  }
  function attachMotion() {
    state.motionEnabled = true;
    window.addEventListener('devicemotion', function (e) {
      if ($('screenShake').classList.contains('hidden') || state.shaking) return;
      var a = e.accelerationIncludingGravity;
      if (!a) return;
      var m = Math.sqrt((a.x || 0) * (a.x || 0) + (a.y || 0) * (a.y || 0) + (a.z || 0) * (a.z || 0));
      var now = Date.now();
      if (m > 18 && now - state.lastMotion > 1200) {
        state.lastMotion = now;
        scatterFromBasket();
      }
    });
  }

  document.addEventListener('touchmove', function (e) {
    if (e.target.closest('.worktable, textarea, .modal-paper')) return;
    e.preventDefault();
  }, { passive: false });

  showScreen('screenSetup');
})();
</script>
</body>
</html>
